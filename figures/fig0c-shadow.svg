<svg xmlns="http://www.w3.org/2000/svg" width="680" height="306" viewBox="0 0 680 306" role="img" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
<title>被否掉的东西去了哪里</title>
<desc>每次做决定,选中的变成言行,被否掉的攒到暗处;暗处那套东西平时只能悄悄改变你看东西的方式,压力累积到某点会直接冲开出口。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="306" fill="#FFFFFF"/>

<rect x="40" y="120" width="140" height="64" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="110" y="144" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">每次做决定</text>
<text x="110" y="164" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">一堆备选里挑一个</text>

<rect x="250" y="50" width="180" height="64" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="340" y="74" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">选中的那个</text>
<text x="340" y="94" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">说出来、做出来</text>

<rect x="250" y="200" width="180" height="64" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="340" y="224" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">被否掉的那些</text>
<text x="340" y="244" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">攒到暗处,越攒越成型</text>

<rect x="480" y="50" width="160" height="64" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="560" y="74" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">你的言行</text>
<text x="560" y="94" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">别人看到的你</text>

<path d="M180 140 L215 140 L215 82 L246 82" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M180 164 L215 164 L215 232 L246 232" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="430" y1="82" x2="476" y2="82" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>

<path d="M430 220 L555 220 L555 118" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<text x="440" y="202" dominant-baseline="central" font-size="12" fill="#993C1D">压力攒够了就冲开出口</text>

<path d="M250 250 L110 250 L110 188" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="40" y="272" dominant-baseline="central" font-size="12" fill="#5F5E5A">平时只能走这条虚线:悄悄改变你看东西的方式,于是你在别人身上看见它</text>
</svg>
