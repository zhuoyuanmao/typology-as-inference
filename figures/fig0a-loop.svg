<svg xmlns="http://www.w3.org/2000/svg" width="680" height="210" viewBox="0 0 680 210" role="img" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
<title>看—过一遍—说或做 的循环</title>
<desc>三步循环:看一眼周围,心里过一遍,说出或做出一点什么;做出来的东西又变成下一刻要看的东西。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="210" fill="#FFFFFF"/>

<rect x="60" y="46" width="160" height="64" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
<text x="140" y="70" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">看一眼</text>
<text x="140" y="90" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">往脑子里装材料</text>

<rect x="260" y="46" width="160" height="64" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="340" y="70" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">心里过一遍</text>
<text x="340" y="90" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">给备选打分排队</text>

<rect x="460" y="46" width="160" height="64" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="540" y="70" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">说或做</text>
<text x="540" y="90" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">选一个交出去</text>

<line x1="224" y1="78" x2="256" y2="78" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="424" y1="78" x2="456" y2="78" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>

<path d="M540 110 L540 150 L140 150 L140 114" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<text x="340" y="170" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">你做出来的东西,又变成下一刻你要看的东西的一部分</text>
</svg>
