<svg xmlns="http://www.w3.org/2000/svg" width="680" height="316" viewBox="0 0 680 316" role="img" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
<title>八个零件的通俗说法</title>
<desc>取材料的零件按取已发生还是取可能发生分成两种,打分的零件按拆成道理还是排成轻重分成两种,每种再分朝外和朝里两个版本,共八个。</desc>
<rect x="0" y="0" width="680" height="316" fill="#FFFFFF"/>

<rect x="40" y="20" width="290" height="266" rx="20" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="60" y="46" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">取材料的零件</text>
<text x="60" y="66" dominant-baseline="central" font-size="12" fill="#5F5E5A">只管往里装,自己不打分</text>
<text x="60" y="96" dominant-baseline="central" font-size="12" fill="#888780">看眼前实实在在有的</text>
<rect x="60" y="110" width="115" height="52" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
<text x="117" y="128" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">朝外</text>
<text x="117" y="147" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Se</text>
<rect x="195" y="110" width="115" height="52" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
<text x="252" y="128" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">朝里</text>
<text x="252" y="147" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Si</text>
<text x="60" y="192" dominant-baseline="central" font-size="12" fill="#888780">看还没发生、可能长出来的</text>
<rect x="60" y="206" width="115" height="52" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
<text x="117" y="224" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">朝外</text>
<text x="117" y="243" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Ne</text>
<rect x="195" y="206" width="115" height="52" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
<text x="252" y="224" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">朝里</text>
<text x="252" y="243" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Ni</text>

<rect x="350" y="20" width="290" height="266" rx="20" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="370" y="46" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">打分的零件</text>
<text x="370" y="66" dominant-baseline="central" font-size="12" fill="#5F5E5A">只对装进来的打分排队</text>
<text x="370" y="96" dominant-baseline="central" font-size="12" fill="#888780">拆成一条条能验的道理</text>
<rect x="370" y="110" width="115" height="52" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="427" y="128" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">朝外</text>
<text x="427" y="147" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Te</text>
<rect x="505" y="110" width="115" height="52" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="562" y="128" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">朝里</text>
<text x="562" y="147" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Ti</text>
<text x="370" y="192" dominant-baseline="central" font-size="12" fill="#888780">排成一个整体的轻重次序</text>
<rect x="370" y="206" width="115" height="52" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="427" y="224" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">朝外</text>
<text x="427" y="243" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Fe</text>
<rect x="505" y="206" width="115" height="52" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="562" y="224" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">朝里</text>
<text x="562" y="243" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Fi</text>

<text x="340" y="302" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">朝外＝外面什么样就照什么样办　朝里＝先被自己那一套改写一遍再用</text>
</svg>
