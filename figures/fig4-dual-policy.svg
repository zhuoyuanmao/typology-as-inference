<svg xmlns="http://www.w3.org/2000/svg" width="680" height="392" viewBox="0 0 680 392" role="img" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
<title>无意识作为对偶策略</title>
<desc>共享表征上挂两个策略头,意识策略占据输出端口,无意识对偶策略被压抑门阻断,其训练数据来自被拒候选,并通过改写知觉先验回流。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="392" fill="#FFFFFF"/>

<rect x="40" y="170" width="120" height="64" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="100" y="194" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">共享表征 h</text>
<text x="100" y="214" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">同一套权重</text>

<rect x="210" y="90" width="180" height="64" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
<text x="300" y="114" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">意识策略 π_c</text>
<text x="300" y="134" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">已校准算子栈</text>

<rect x="210" y="250" width="180" height="64" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="300" y="274" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">无意识对偶 π_u</text>
<text x="300" y="294" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">训练数据＝被拒候选</text>

<rect x="430" y="250" width="110" height="64" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="485" y="274" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">压抑门 g(e)</text>
<text x="485" y="294" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">常态关闭</text>

<rect x="430" y="90" width="200" height="64" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="530" y="114" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">输出端口 · 解码</text>
<text x="530" y="134" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">e(t) 超阈 → grip</text>

<path d="M160 190 L185 190 L185 122 L206 122" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M160 214 L185 214 L185 282 L206 282" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="390" y1="122" x2="426" y2="122" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="390" y1="282" x2="426" y2="282" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M485 250 L485 200 L530 200 L530 158" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="300" y1="154" x2="300" y2="246" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<text x="310" y="200" dominant-baseline="central" font-size="12" fill="#5F5E5A">被拒候选流</text>

<path d="M620 154 L620 350 L485 350 L485 318" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<text x="552" y="368" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">误差累积 e(t)</text>

<path d="M206 306 L100 306 L100 238" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="40" y="330" dominant-baseline="central" font-size="12" fill="#5F5E5A">投射：π_u 改写①的知觉先验</text>
</svg>
