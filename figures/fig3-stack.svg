<svg xmlns="http://www.w3.org/2000/svg" width="680" height="356" viewBox="0 0 680 356" role="img" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
<title>功能栈的调用门槛与输出方差</title>
<desc>沿主导、辅助、第三、劣势向下,调用门槛与输出方差同步升高。</desc>
<rect x="0" y="0" width="680" height="356" fill="#FFFFFF"/>
<text x="40" y="42" dominant-baseline="central" font-size="12" fill="#5F5E5A">以 INFP 为例</text>
<text x="200" y="42" dominant-baseline="central" font-size="12" fill="#5F5E5A">调用门槛 τ</text>
<text x="390" y="42" dominant-baseline="central" font-size="12" fill="#5F5E5A">输出方差 σ</text>

<rect x="40" y="70" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="60" y="90" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">主导 · Fi</text>
<text x="60" y="110" dominant-baseline="central" font-size="12" fill="#5F5E5A">默认调用</text>
<rect x="200" y="93" width="160" height="10" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="200" y="93" width="20" height="10" rx="4" fill="#7F77DD"/>
<rect x="390" y="93" width="160" height="10" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="390" y="93" width="18" height="10" rx="4" fill="#D85A30"/>
<text x="566" y="98" dominant-baseline="central" font-size="12" fill="#5F5E5A">稳定</text>

<rect x="40" y="134" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="60" y="154" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">辅助 · Ne</text>
<text x="60" y="174" dominant-baseline="central" font-size="12" fill="#5F5E5A">配合调用</text>
<rect x="200" y="157" width="160" height="10" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="200" y="157" width="52" height="10" rx="4" fill="#7F77DD"/>
<rect x="390" y="157" width="160" height="10" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="390" y="157" width="44" height="10" rx="4" fill="#D85A30"/>
<text x="566" y="162" dominant-baseline="central" font-size="12" fill="#5F5E5A">较稳</text>

<rect x="40" y="198" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="60" y="218" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">第三 · Si</text>
<text x="60" y="238" dominant-baseline="central" font-size="12" fill="#5F5E5A">费力调用</text>
<rect x="200" y="221" width="160" height="10" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="200" y="221" width="98" height="10" rx="4" fill="#7F77DD"/>
<rect x="390" y="221" width="160" height="10" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="390" y="221" width="90" height="10" rx="4" fill="#D85A30"/>
<text x="566" y="226" dominant-baseline="central" font-size="12" fill="#5F5E5A">波动</text>

<rect x="40" y="262" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="60" y="282" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">劣势 · Te</text>
<text x="60" y="302" dominant-baseline="central" font-size="12" fill="#5F5E5A">被迫调用</text>
<rect x="200" y="285" width="160" height="10" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="200" y="285" width="152" height="10" rx="4" fill="#7F77DD"/>
<rect x="390" y="285" width="160" height="10" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="390" y="285" width="160" height="10" rx="4" fill="#D85A30"/>
<text x="566" y="290" dominant-baseline="central" font-size="12" fill="#5F5E5A">失控</text>
</svg>
